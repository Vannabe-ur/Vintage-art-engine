[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vintage-art-engine"
version = "0.1.0"
description = "Generate two-tone vintage artwork and printable memory poster cards."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
vintage-art-card = "vintage_art.poster:main"

[tool.setuptools.packages.find]
where = ["src"]
